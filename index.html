<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evenly</title>
<meta name="description" content="Evenly keeps your Mac's volume even. One switch in the menu bar.">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mute:#6e6e73; --acc:#0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --mute:#98989d; --acc:#0a84ff; } }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; text-align:center; padding:0 16px; }
  main { max-width:520px; }
  h1 { font-size:56px; letter-spacing:-.02em; margin:0 0 8px; }
  p { color:var(--mute); margin:0 0 24px; }
  .pill { display:inline-block; padding:6px 14px; border-radius:999px; background:var(--acc); color:#fff; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Evenly</h1>
  <p>Keeps your Mac's volume even. One switch in the menu bar: quiet parts come up, loud parts stay in check.</p>
  <span class="pill">Coming soon · Apple silicon</span>
</main>
</body>
</html>
